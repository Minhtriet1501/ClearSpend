spring.application.name=clearspend
server.servlet.context-path=/api

# Local mac dinh; cloud/Atlas se override MONGODB_URI qua env var (externalize config)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clearspend}

spring.data.mongodb.auto-index-creation=true

# AWS region cho SQS client; override qua env var AWS_REGION
aws.region=us-west-2
clearspend.sqs.ingest-queue-url=${INGEST_QUEUE_URL:https://sqs.us-west-2.amazonaws.com/880790862434/clearspend-ingest}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

clearspend.mesa.base-url=https://citydata.mesaaz.gov
clearspend.mesa.dataset-id=j7s9-qiuq

clearspend.ingest.scheduled=false
clearspend.ingest.schedule-ms=3600000
clearspend.ingest.initial-delay-ms=10000



